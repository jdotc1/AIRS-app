[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airs"
version = "0.1.0"
description = "Bounded, offline ARM64 Mach-O unwind diagnostics"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
airs = "airs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
